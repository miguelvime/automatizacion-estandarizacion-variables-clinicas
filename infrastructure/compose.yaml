services:
  # ==============================================================================
  # Orquestador de Flujos de Codificación Clínica (n8n)
  # ==============================================================================
  n8n:
    image: n8nio/n8n@sha256:a49bc161141d6c4b9c495b5a6e3c7c1932e61d2ed2fe3fdca01262064b4b23ca
    container_name: n8n-main
    environment:
      - N8N_RUNNERS_MODE=internal
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_PYTHON_ALLOWED_MODULES=random,math,json,datetime
    ports:
      - "5679:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../results:/home/node/results
      - ../data:/home/node/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==============================================================================
  # Contenedor de Análisis Estadístico y Generación de TFL (Python 3.12 + R 4.4)
  # ==============================================================================
  analysis:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.analysis
    container_name: tfm-analysis
    volumes:
      - ../data:/workspace/data
      - ../scripts:/workspace/scripts
      - ../results:/workspace/results
    working_dir: /workspace
    command: python3 scripts/analysis/ejecutar_todo.py

volumes:
  n8n_data:
